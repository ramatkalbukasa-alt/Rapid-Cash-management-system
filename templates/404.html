<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Introuvable — RAPID CASH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <style>
        body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#030304; color:#fff; margin:0; font-family:'Space Grotesk',sans-serif; }
        .error-container { text-align:center; max-width:500px; padding:2rem; }
        .error-code { font-size:8rem; font-weight:700; color:transparent; background:linear-gradient(135deg,#00D1FF,#FF005C); -webkit-background-clip:text; background-clip:text; line-height:1; font-family:'JetBrains Mono',monospace; }
        .error-title { font-size:1.5rem; font-weight:600; margin:1rem 0 0.5rem; }
        .error-message { color:#94A3B8; font-size:0.875rem; margin-bottom:2rem; }
        .error-btn { display:inline-flex; align-items:center; gap:0.5rem; background:linear-gradient(135deg,#014D4E,#006B4F); color:#fff; text-decoration:none; padding:0.75rem 1.5rem; border-radius:9999px; font-weight:600; font-size:0.875rem; transition:opacity 0.2s; }
        .error-btn:hover { opacity:0.9; }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Introuvable</h1>
        <p class="error-message">La ressource que vous cherchez n'existe pas ou a été déplacée.</p>
        <a href="/" class="error-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Retour au Terminal
        </a>
    </div>
</body>
</html>
