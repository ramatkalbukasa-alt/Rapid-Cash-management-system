services:
  - type: web
    name: quick-transfert
services:
  - type: web
    name: quick-transfert
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start_prod.sh
    healthCheckPath: /
    envVars:
      - key: DEBUG
        value: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      # Le DATABASE_URL sera géré manuellement dans le Dashboard Render
